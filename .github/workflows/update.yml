name: Dumping

on:
    workflow_dispatch:
        inputs:
            branch:
                description: "Steam depot branch (blank = public/default)"
                required: false
                default: "public"

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    dump:
        uses: swiftly-tracker/dumps/.github/workflows/dumper.yml@main
        permissions:
            contents: write
            statuses: write
        with:
            app_id: "730"
            branch: ${{ inputs.branch }}
            game_folder: "csgo"
            tracked_files: "tracked_files.json"
        secrets: inherit
